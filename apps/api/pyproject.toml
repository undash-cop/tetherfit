[project]
name = "tetherfit-api"
version = "0.1.0"
description = "TetherFit API – Trainer Business Operating System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.140.6",
  "uvicorn[standard]==0.51.0",
  "sqlalchemy[asyncio]==2.0.51",
  "asyncpg==0.31.0",
  "alembic==1.18.5",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "redis==8.0.1",
  "celery==5.6.3",
  "boto3==1.43.56",
  "PyJWT[crypto]==2.13.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "email-validator==2.3.0",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
  "black==26.5.1",
  "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
