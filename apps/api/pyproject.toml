[project]
name = "tetherfit-api"
version = "0.1.0"
description = "TetherFit API – Trainer Business Operating System"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.3",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
  "celery==5.6.3",
  "boto3==1.43.109",
  "PyJWT[crypto]==2.15.1",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "email-validator==2.3.0",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
  "black==26.10.0",
  "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
