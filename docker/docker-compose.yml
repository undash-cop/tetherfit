# Local / laptop only — API container.
# Production deployment follows udc-infra (`deploy-apps.sh`) for API, and Netlify for web.

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env.example
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Override for Docker Desktop talking to host Undash services if needed
      # KEYCLOAK_SERVER_URL: http://host.docker.internal:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.infrastructure.celery_app.celery_app", "worker", "-l", "info"]
    env_file:
      - ../.env.example
    depends_on:
      - api

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.infrastructure.celery_app.celery_app", "beat", "-l", "info"]
    env_file:
      - ../.env.example
    depends_on:
      - api

# External Undash-Cop / UDC services (not started here):
# - PostgreSQL  → DATABASE_URL
# - Redis       → REDIS_URL / CELERY_*
# - Keycloak    → KEYCLOAK_* / UDC_JWT_ISSUER
# - Cloudflare R2 → R2_*
# Frontend → Netlify (or `cd apps/web && npm run dev` locally)
