# TetherFit web — Netlify
# API lives on UDC VPS: https://api.tetherfit.undash-cop.com

[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public client-side config (safe to bake into the SPA). Override in Netlify UI for previews if needed.
  VITE_API_URL = "https://api.tetherfit.undash-cop.com"
  VITE_KEYCLOAK_URL = "https://secure.undash-cop.com"
  VITE_KEYCLOAK_REALM = "tetherfit"
  VITE_KEYCLOAK_CLIENT_ID = "tetherfit-web"

# SPA fallback (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed assets; keep HTML fresh
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
